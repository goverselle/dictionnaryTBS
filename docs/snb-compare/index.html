<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNB Déviants — Comparaison F / M</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; color: #222; padding: 12px; font-size: 16px; }
h1 { text-align: center; font-size: 1.4rem; margin-bottom: 8px; }
.tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
.tab { padding: 8px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 16px; background: #f1f5f9; color: #64748b; border: none; }
.tab.on { background: #7c3aed; color: #fff; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; padding: 10px; background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.controls input { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; flex: 1; min-width: 120px; }
.controls select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
.stats { text-align: center; margin-bottom: 10px; font-size: 14px; color: #64748b; }
.loading { text-align: center; padding: 40px; font-size: 18px; color: #94a3b8; }
.list { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.list-header { display: grid; grid-template-columns: 1fr 50px 50px 70px 1fr 1fr; padding: 8px 10px; font-weight: 700; font-size: 14px; color: #64748b; border-bottom: 2px solid #e2e8f0; }
.list-body { max-height: 70vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.row { display: grid; grid-template-columns: 1fr 50px 50px 70px 1fr 1fr; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; font-size: 15px; cursor: pointer; align-items: center; }
.row:hover { background: #faf5ff; }
.row .lemme { font-weight: 700; }
.row .count-f { color: #c05ab0; font-weight: 600; }
.row .count-m { color: #3b82f6; font-weight: 600; }
.row .ratio { font-size: 13px; color: #64748b; }
.row .preview { font-size: 13px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.5); z-index: 1000; justify-content: center; align-items: flex-start; padding: 20px; overflow-y: auto; }
.modal.on { display: flex; }
.modal-box { background: #fff; border-radius: 12px; padding: 20px; max-width: 1000px; width: 100%; max-height: 85vh; overflow-y: auto; margin: auto; }
.modal-box h2 { margin-bottom: 12px; color: #7c3aed; font-size: 22px; }
.detail-cols { display: flex; gap: 16px; }
.detail-col { flex: 1; min-width: 0; }
.detail-col h3 { font-size: 16px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 3px solid; }
.detail-col.fem h3 { color: #c05ab0; border-color: #c05ab0; }
.detail-col.masc h3 { color: #3b82f6; border-color: #3b82f6; }
.detail-word { padding: 6px; font-size: 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; border-radius: 4px; }
.detail-word:hover { background: #f8f5ff; }
.detail-word .w { font-weight: 600; }
.detail-word .cnt { color: #94a3b8; margin-left: 4px; }
.occs { display: none; margin: 4px 0 8px 12px; border-left: 3px solid #e2e8f0; padding-left: 10px; }
.occs.open { display: block; }
.occ { margin-bottom: 8px; padding: 6px; background: #faf5ff; border-radius: 6px; }
.occ .poet { font-weight: 600; font-size: 13px; color: #7c3aed; }
.occ .ctx { font-size: 14px; line-height: 1.4; white-space: pre-wrap; font-family: Georgia, serif; margin-top: 2px; }
.close-btn { position: sticky; top: 0; float: right; background: #e2e8f0; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 18px; cursor: pointer; z-index: 10; }

/* Mobile */
@media (max-width: 768px) {
  body { padding: 8px; font-size: 14px; }
  h1 { font-size: 1.2rem; }
  .list-header { grid-template-columns: 1fr 40px 40px 60px; font-size: 12px; }
  .list-header span:nth-child(5), .list-header span:nth-child(6) { display: none; }
  .row { grid-template-columns: 1fr 40px 40px 60px; font-size: 14px; }
  .row .preview { display: none; }
  .detail-cols { flex-direction: column; }
  .modal-box { padding: 14px; }
  .modal-box h2 { font-size: 18px; }
  .tab { padding: 6px 14px; font-size: 14px; }
}
</style>
</head>
<body>
<h1>SNB Déviants — Comparaison F / M</h1>
<div class="stats" id="stats"></div>
<div class="tabs">
  <button class="tab on" id="tab-noms" onclick="showTab('noms')">Noms</button>
  <button class="tab" id="tab-adjs" onclick="showTab('adjs')">Adjectifs</button>
</div>
<div class="controls">
  <input type="text" id="search" placeholder="chercher un lemme...">
  <select id="sort-select">
    <option value="total">Tri: fréquence totale</option>
    <option value="ratio-f">Tri: ratio F/M</option>
    <option value="ratio-m">Tri: ratio M/F</option>
    <option value="alpha">Tri: alphabétique</option>
    <option value="diff">Tri: différence absolue</option>
  </select>
</div>
<div class="list">
  <div class="list-header">
    <span>Lemme</span>
    <span>F</span>
    <span>M</span>
    <span>Ratio</span>
    <span>Top F</span>
    <span>Top M</span>
  </div>
  <div class="list-body" id="list-body"><div class="loading" id="loading">Chargement des données...</div></div>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>
<script>
let DATA = null;
let currentTab = 'noms';

fetch('data.json')
  .then(r => r.json())
  .then(d => { DATA = d; init(); })
  .catch(e => { document.getElementById('loading').textContent = 'Erreur de chargement: ' + e; });

function init() {
  document.getElementById('stats').textContent =
    `Corpus: ${DATA.total_f.toLocaleString()} SNB femmes | ${DATA.total_m.toLocaleString()} SNB hommes`;
  render();
}

function showTab(tab) {
  currentTab = tab;
  document.getElementById('tab-noms').className = tab === 'noms' ? 'tab on' : 'tab';
  document.getElementById('tab-adjs').className = tab === 'adjs' ? 'tab on' : 'tab';
  render();
}

function getItems() {
  let items = currentTab === 'noms' ? DATA.noms : DATA.adjs;
  const q = document.getElementById('search').value.toLowerCase();
  if (q) items = items.filter(x => x.lemme.includes(q));
  const sort = document.getElementById('sort-select').value;
  items = items.slice();
  if (sort === 'total') items.sort((a, b) => (b.f + b.m) - (a.f + a.m));
  else if (sort === 'ratio-f') items.sort((a, b) => (b.f / (b.m || 1)) - (a.f / (a.m || 1)));
  else if (sort === 'ratio-m') items.sort((a, b) => (b.m / (b.f || 1)) - (a.m / (a.f || 1)));
  else if (sort === 'alpha') items.sort((a, b) => a.lemme.localeCompare(b.lemme));
  else if (sort === 'diff') items.sort((a, b) => Math.abs(b.f/(DATA.total_f)*10000 - b.m/(DATA.total_m)*10000) - Math.abs(a.f/(DATA.total_f)*10000 - a.m/(DATA.total_m)*10000));
  return items;
}

function render() {
  if (!DATA) return;
  const items = getItems();
  const body = document.getElementById('list-body');
  const fKey = currentTab === 'noms' ? 'adj_f' : 'noms_f';
  const mKey = currentTab === 'noms' ? 'adj_m' : 'noms_m';
  const wordKey = currentTab === 'noms' ? 'adj' : 'nom';

  body.innerHTML = items.slice(0, 500).map((item, i) => {
    const ratio = item.m > 0 ? (item.f / DATA.total_f) / (item.m / DATA.total_m) : 99;
    const ratioStr = ratio > 1 ? `${ratio.toFixed(1)}x F` : `${(1/ratio).toFixed(1)}x M`;
    const fArr = item[fKey] || [];
    const mArr = item[mKey] || [];
    const prevF = fArr.slice(0, 4).map(x => x[wordKey] || '').join(', ');
    const prevM = mArr.slice(0, 4).map(x => x[wordKey] || '').join(', ');
    return `<div class="row" onclick="showDetail(${i})">
      <span class="lemme">${item.lemme}</span>
      <span class="count-f">${item.f}</span>
      <span class="count-m">${item.m}</span>
      <span class="ratio">${ratioStr}</span>
      <span class="preview">${prevF}</span>
      <span class="preview">${prevM}</span>
    </div>`;
  }).join('');
  body._items = items;
}

function showDetail(idx) {
  const items = document.getElementById('list-body')._items;
  const item = items[idx];
  const fKey = currentTab === 'noms' ? 'adj_f' : 'noms_f';
  const mKey = currentTab === 'noms' ? 'adj_m' : 'noms_m';
  const wordKey = currentTab === 'noms' ? 'adj' : 'nom';
  const label = currentTab === 'noms' ? 'Adjectifs' : 'Noms';

  let html = `<button class="close-btn" onclick="closeModal()">✕</button>`;
  html += `<h2>${item.lemme} <span style="font-size:15px;color:#64748b;">(F: ${item.f} | M: ${item.m})</span></h2>`;
  html += `<div class="detail-cols">`;

  html += `<div class="detail-col fem"><h3>${label} — Femmes (${item.f})</h3>`;
  (item[fKey]||[]).forEach((x, i) => {
    html += `<div class="detail-word" onclick="toggleOccs('f${i}')"><span class="w">${x.occs?x.occs[0].s:x[wordKey]}</span><span class="cnt">x${x.n}</span></div>`;
    html += `<div class="occs" id="occs-f${i}">`;
    (x.occs||[]).forEach(o => {
      let ctx = (o.c||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      const snbEsc = (o.s||'').replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&');
      if (snbEsc) ctx = ctx.replace(new RegExp('('+snbEsc+')','gi'), '<b style="color:#7c3aed">$1</b>');
      ctx = ctx.replace(/\\n/g, '<br>');
      html += `<div class="occ"><div class="poet">${o.p}</div><div class="ctx">${ctx}</div></div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;

  html += `<div class="detail-col masc"><h3>${label} — Hommes (${item.m})</h3>`;
  (item[mKey]||[]).forEach((x, i) => {
    html += `<div class="detail-word" onclick="toggleOccs('m${i}')"><span class="w">${x.occs?x.occs[0].s:x[wordKey]}</span><span class="cnt">x${x.n}</span></div>`;
    html += `<div class="occs" id="occs-m${i}">`;
    (x.occs||[]).forEach(o => {
      let ctx = (o.c||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      const snbEsc = (o.s||'').replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&');
      if (snbEsc) ctx = ctx.replace(new RegExp('('+snbEsc+')','gi'), '<b style="color:#7c3aed">$1</b>');
      ctx = ctx.replace(/\\n/g, '<br>');
      html += `<div class="occ"><div class="poet">${o.p}</div><div class="ctx">${ctx}</div></div>`;
    });
    html += `</div>`;
  });
  html += `</div></div>`;

  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal').classList.add('on');
}

function toggleOccs(id) {
  document.getElementById('occs-' + id).classList.toggle('open');
}

function closeModal() { document.getElementById('modal').classList.remove('on'); }
document.getElementById('search').oninput = render;
document.getElementById('sort-select').onchange = render;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
